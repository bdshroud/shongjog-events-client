<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="shongjog_bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1238"/>
      <stop offset="100%" stop-color="#0A0612"/>
    </linearGradient>
    <linearGradient id="shongjog_glow" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E879F9"/>
      <stop offset="50%" stop-color="#C04BF2"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow_filter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#C04BF2" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="32" height="32" rx="8" fill="url(#shongjog_bg)"/>
  <rect width="30" height="30" x="1" y="1" rx="7" stroke="url(#shongjog_glow)" stroke-opacity="0.35" stroke-width="1"/>
  
  <!-- Stylized Shongjog 'S' Connection Ribbon -->
  <path d="M20 9.5C18 7.8 15 7.8 13 9C11 10.2 10.5 12.2 11 14.2C11.6 16.5 14 17 16 17.5C18.5 18.2 21 19.2 21 21.8C21 24.2 18.8 25.8 16 25.8C13.5 25.8 11.5 24.5 10.5 22.8" 
        stroke="url(#shongjog_glow)" 
        stroke-width="2.8" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow_filter)"/>

  <!-- Connected Community Nodes -->
  <circle cx="20.5" cy="9.5" r="2.2" fill="#F472B6"/>
  <circle cx="10.5" cy="22.8" r="2.2" fill="#A855F7"/>
  <circle cx="16" cy="17.5" r="1.6" fill="#FFFFFF"/>
</svg>
